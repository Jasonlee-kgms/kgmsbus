<script src="config.js"></script>
<script>
(function(){
  var CFG = window.BUS_CONFIG || {};

  function serverError(msg){ var e=new Error(msg); e.fromServer=true; return e; }

  // 1차: POST. Content-Type 을 text/plain 으로 보내야 프리플라이트(OPTIONS) 없이 통과한다.
  // (GAS 는 OPTIONS 에 응답하지 못하므로 application/json 으로 보내면 CORS 에 막힌다)
  function postCall(fn, args){
    return fetch(CFG.gasUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({fn:fn, args:args}),
      redirect:'follow'
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.ok) throw serverError((j && j.error) || 'api_error');
      return j.result;
    });
  }

  // 2차: 스크립트 태그(JSONP). CORS 검사 자체가 없어서 아이폰 홈 화면 앱에서도 통과한다.
  // 아이폰은 (1) 구글 로그인 창에서 앱으로 막 돌아온 순간의 요청을 끊거나
  // (2) Apps Script 의 POST→리디렉션을 거부해 "Load failed" 를 내는 경우가 있어 대비용으로 둔다.
  var cbSeq=0;
  function jsonpCall(fn, args){
    return new Promise(function(resolve, reject){
      var cb='__gasCb'+Date.now()+'_'+(cbSeq++);
      var s=document.createElement('script');
      // Apps Script 는 한동안 안 쓰이다 첫 요청이 오면 깨어나는 데 수십 초가 걸리기도 한다(실측 54초)
      var timer=setTimeout(function(){ done(); reject(new Error('서버 응답이 늦습니다. 잠시 후 다시 시도해 주세요')); }, 60000);
      function done(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
      window[cb]=function(j){
        done();
        if(!j || !j.ok) reject(serverError((j && j.error) || 'api_error'));
        else resolve(j.result);
      };
      s.onerror=function(){ done(); reject(new Error('서버에 연결하지 못했습니다')); };
      s.src=CFG.gasUrl+'?api='+encodeURIComponent(fn)
        +'&args='+encodeURIComponent(JSON.stringify(args))
        +'&callback='+cb+'&_='+Date.now();
      document.head.appendChild(s);
    });
  }

  function call(fn, args){
    if(!CFG.gasUrl || CFG.gasUrl.indexOf('여기에_배포ID')>=0){
      return Promise.reject(new Error('config.js 의 gasUrl 을 먼저 설정해 주세요.'));
    }
    return postCall(fn, args).catch(function(err){
      if(err && err.fromServer) throw err;             // 서버가 거절한 건 재시도해도 같으므로 그대로 전달
      return new Promise(function(r){ setTimeout(r, 800); })   // 앱이 완전히 앞으로 올라올 시간
        .then(function(){ return jsonpCall(fn, args); });
    });
  }

  var run = {
    _s:null, _f:null,
    withSuccessHandler:function(fn){ this._s=fn; return this; },
    withFailureHandler:function(fn){ this._f=fn; return this; }
  };

  // ⚠ Api.gs 의 API_ALLOW 와 같은 목록이어야 한다. 서버에 함수를 추가하면 여기에도 추가할 것.
  ['getMeta','getBusLive','login','checkSession','whoAmI','getSubscription','subscribe','unsubscribe',
   'savePushToken','deletePushToken','saveFeedback','reportPushDelay'].forEach(function(name){
    run[name]=function(){
      var args=[].slice.call(arguments), s=this._s, f=this._f;
      call(name,args).then(function(res){ if(s) s(res); }).catch(function(err){ if(f) f(err); });
    };
  });

  // 관리자 기능은 공개 사이트에서 제공하지 않는다(관리자 PIN을 외부로 내보내지 않기 위해).
  // 좌표 조정·경유지 편집·명단 보기는 학교 내부 GAS 화면에서만 사용.
  ['adminCheck','adminSaveCoord','adminSaveVia','adminRoster'].forEach(function(name){
    run[name]=function(){
      var f=this._f;
      setTimeout(function(){ if(f) f({message:'관리자 기능은 학교 내부(Apps Script) 화면에서만 사용합니다.'}); },0);
    };
  });

  window.google = { script: { run: run } };
})();
</script>

<style>
  :root{--panel:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--ink)}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden}
  #side{width:350px;flex:0 0 350px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #side header{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  #side header h1{margin:0;font-size:16px;line-height:1.35}
  #side header p{margin:5px 0 0;font-size:12px;color:var(--muted)}
  .dirtabs{display:flex;gap:6px;margin-top:10px}
  .dirtabs button{flex:1;padding:9px 0;border:1px solid #cbd5e1;background:#fff;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;color:#64748b}
  .dirtabs button.on{background:#2456d8;border-color:#2456d8;color:#fff}
  .dirnote{font-size:11.5px;color:var(--muted);margin-top:7px}
  .finder{padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc}
  .finder h3{margin:0 0 8px;font-size:14px}
  .finder .row{display:flex;gap:6px}
  .finder input{flex:1;min-width:0;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
  .finder button{padding:8px 12px;border:0;background:#2456d8;color:#fff;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .finder .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .finder .result{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;display:none;line-height:1.5}
  .finder .result.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0}
  .finder .result.err{display:block;background:#fef2f2;border:1px solid #fecaca}
  #routes{overflow-y:auto;flex:1;padding:8px 10px 20px}
  .route{border:1px solid var(--line);border-radius:12px;margin:8px 4px;overflow:hidden}
  .route h2{margin:0;font-size:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:#fafafa}
  .route h2 .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .route h2 .meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400}
  .stops{list-style:none;margin:0;padding:0;display:none}
  .route.open .stops{display:block}
  .stops li{padding:8px 12px 8px 34px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
  .stops li:hover{background:#f5f7ff}
  .stops li.hl{background:#fff7ed;box-shadow:inset 3px 0 0 #f08c00}
  .stops li .nm{font-weight:600}
  .stops li .sub{color:var(--muted);font-size:11.5px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
  .badge{display:inline-block;background:#eef2ff;color:#3743d0;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
  .tm{color:#0f766e;font-weight:600}
  .eta{color:#b45309;font-weight:600}
  #map{flex:1;height:100%}
  .marker-num{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff;font-size:12px}
  .marker-num.hl{animation:pulse 1s ease-in-out 3;border:3px solid #f08c00}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  .school-ic{background:#111;color:#fff;border:2px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .leaflet-popup-content{font-size:13px;line-height:1.5;margin:10px 12px}
  .pop-t{margin-top:6px;padding-top:6px;border-top:1px dashed #ddd}
  .legend{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
  .legend .dot{width:14px;height:4px;border-radius:2px}

  /* ==================================================================
     Apple-inspired refinement — apple-design 스킬(emilkowalski, MIT) 반영
     · 시스템 타이포(음수 트래킹) · 반투명 머티리얼/깊이 · 눌림 피드백
     · 스프링 이징 · reduced-motion / transparency / contrast 대응
     ================================================================== */
  :root{ --ink:#1d1d1f; --muted:#6e6e73; --line:#e6e6ea; --accent:#0a84ff;
    --ease-spring:cubic-bezier(.32,.72,0,1); --glass:saturate(180%) blur(20px); }

  .finder button:active,.apbtn:active,#mobileTabs button:active{ transform:scale(.96); }

  /* 지도 위에 뜨는 반투명 크롬(Materials & depth) */
  .legend,#adminPanel,#mobileTabs,.rm-box,#toast{ -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); }
  .legend{ background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.5); border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.14); }

  .leaflet-popup-content-wrapper{ border-radius:16px !important; box-shadow:0 10px 34px rgba(0,0,0,.18) !important; }
  .leaflet-popup-tip{ box-shadow:none !important; }
  .marker-num{ box-shadow:0 2px 8px rgba(0,0,0,.28); }
  /* 모달: 트리거에서 자라나듯(Spatial consistency·Materialize) */
  .rm-box{ border-radius:20px; animation:rmIn .4s var(--ease-spring); }
  @keyframes rmIn{ from{ opacity:0; transform:scale(.94) translateY(8px); } to{ opacity:1; transform:none; } }
  #overlay .bar>i{ transition:width .4s var(--ease-spring); }
  /* 접근성 — reduced motion / transparency / contrast */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.06ms !important; }
    .marker-num.hl{ animation:none; }
  }
  @media (prefers-reduced-transparency: reduce){
    #side header,.finder,.legend,#adminPanel,#mobileTabs,.rm-box{ backdrop-filter:none; -webkit-backdrop-filter:none; background:#fff; }

  }
  @media (prefers-contrast: more){
    :root{ --line:#c7c7cc; }
    .legend,#adminPanel{ border:1px solid #c7c7cc; background:#fff; }
  }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function gcall(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){
  google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,a);});}

let META=null, SCHOOL=null, schoolLatLng=null, activeDir="going";
let adminMode=false, adminPin="", viaMarkers=[];
const built={going:false,coming:false};
const layers={going:{},coming:{}};      // dir -> routeId -> layerGroup
const markers={going:{},coming:{}};      // dir -> key -> marker
const SIHEUNG={minLat:37.33,maxLat:37.50,minLng:126.72,maxLng:126.88};
const map=L.map("map",{zoomControl:true}).setView([37.4265,126.8250],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap 기여자"}).addTo(map);

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inSiheung=(a,b)=>a>=SIHEUNG.minLat&&a<=SIHEUNG.maxLat&&b>=SIHEUNG.minLng&&b<=SIHEUNG.maxLng;
const cnt=s=>(s.count||0);   // 알림 구독자 수 (명단이 없으므로 실제 탑승 인원이 아님)
const fmtMin=s=>s==null?"계산 불가":"약 "+Math.round(s/60)+"분";
function haversine(a,b){const R=6371000,t=Math.PI/180,dLat=(b[0]-a[0])*t,dLng=(b[1]-a[1])*t;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
const setProgress=(p,m)=>{document.getElementById("ovBar").style.width=(p*100).toFixed(0)+"%";if(m)document.getElementById("ovMsg").textContent=m;};
const showOverlay=on=>document.getElementById("overlay").style.display=on?"flex":"none";

const geoCache={};
// 계산 결과(노선 경로·소요시간·메타)를 폰에 저장해 두 번째 접속부터 바로 뜨게 한다.
const LS_KEY="kgmsbusCache1", LS_TTL=7*24*3600*1000;
function lsGet(k){ try{const o=JSON.parse(localStorage.getItem(LS_KEY)||"{}"),v=o[k];
  return (v && Date.now()-v.t<LS_TTL) ? v.d : null;}catch(e){return null;} }
function lsSet(k,d){ try{const o=JSON.parse(localStorage.getItem(LS_KEY)||"{}");
  o[k]={t:Date.now(),d:d}; localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){} }
async function geocode(qs){
  for(const q of qs){
    if(geoCache[q]!==undefined){if(geoCache[q])return geoCache[q];else continue;}
    try{
      const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&viewbox=126.72,37.50,126.88,37.33&bounded=1&q="+encodeURIComponent(q);
      const r=await fetch(url,{headers:{"Accept-Language":"ko"}}); await sleep(1100);
      if(!r.ok){geoCache[q]=null;continue;}
      const a=await r.json();
      if(a&&a.length){const lat=parseFloat(a[0].lat),lng=parseFloat(a[0].lon);if(inSiheung(lat,lng)){geoCache[q]=[lat,lng];return[lat,lng];}}
      geoCache[q]=null;
    }catch(e){geoCache[q]=null;await sleep(300);}
  }
  return null;
}
function goodLL(ll){ return ll && ll[0]>33 && ll[0]<39 && ll[1]>124 && ll[1]<132; }  // 한국 범위(0,0 등 오류 배제)
// 좌표 우선순위: coords 시트(실측) → 코드 내장 좌표(즉시) → 지오코딩(마지막 수단)
// 예전에는 내장 좌표가 있어도 지오코딩을 먼저 했는데, OpenStreetMap 정책상 1.1초씩 쉬어야 해서
// 정류장 19곳에 약 23초가 걸렸다(실측). 학생 폰마다 매번 반복되던 지연이라 순서를 바꿨다.
async function resolveLL(s){
  if(goodLL(s.ll)) return s.ll;
  if(goodLL(s.fb)) return s.fb;
  return await geocode(s.q) || s.fb;
}
async function osrmRoute(wp,opts={}){
  const coords=wp.map(p=>p[1]+","+p[0]).join(";");
  let url="https://router.project-osrm.org/route/v1/driving/"+coords+"?overview=full&geometries=geojson&annotations=duration";
  if(opts.exclude)url+="&exclude="+encodeURIComponent(opts.exclude);
  const r=await fetch(url); if(!r.ok)throw new Error("OSRM "+r.status);
  const j=await r.json(); if(!j.routes||!j.routes.length)throw new Error("no route");
  return {geometry:j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]), legDur:(j.routes[0].legs||[]).map(l=>l.duration)};
}
const numIcon=(color,txt,size=28,hl=false)=>L.divIcon({className:"",html:`<div class="marker-num${hl?" hl":""}" style="background:${color};width:${size}px;height:${size}px">${txt}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
const schoolIcon=()=>L.divIcon({className:"",html:`<div class="school-ic" style="width:34px;height:34px">🏫</div>`,iconSize:[34,34],iconAnchor:[17,17]});

// ---- 초기화: 메타 + 학교 + 등교 방향 --------------------------------
async function init(){
  // 서버를 기다리지 않는 순서: 폰에 저장된 값 → 빌드 때 넣어둔 스냅샷 → 서버
  // (Apps Script 는 한동안 쉬면 첫 응답에 최대 18초가 걸린다 — 실측)
  // 폰에 저장된 정류장 정보가 이 파일의 스냅샷과 판번호가 다르면(좌표·경로가 바뀐 것) 버린다.
  // 이걸 안 하면 새 파일을 올려도 학생 폰은 7일 동안 옛 좌표로 경로를 계산한다.
  /* 폰에 저장된 것과 파일에 심어둔 스냅샷 중 "더 최신"을 쓴다.
   * 판번호(dataVer)가 다르면 경로 캐시도 함께 비운다 — 좌표가 바뀐 것이므로.
   * 관리자가 지도에서 핀을 옮기면 서버 데이터가 새로워지는데, 이때 파일을 다시
   * 올리지 않아도 학생 화면이 최신값을 쓰게 하려고 시각(metaAt)으로 비교한다. */
  const snapMeta=window.BUS_META_SNAPSHOT||null;
  let storedMeta=lsGet("meta");
  if(storedMeta && snapMeta){
    const changed = storedMeta.dataVer!==snapMeta.dataVer;
    const storedNewer = Number(storedMeta.metaAt||0) > Number(snapMeta.metaAt||0);
    if(changed){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}     // 좌표가 달라졌으니 경로 캐시 폐기
      if(!storedNewer) storedMeta=null;                      // 스냅샷이 더 최신이면 저장본을 버린다
    }
  }
  const cachedMeta=storedMeta || snapMeta;
  if(cachedMeta){ META=cachedMeta; }
  else { META=await gcall("getMeta"); lsSet("meta",META); }
  SCHOOL=META.school;
  setProgress(0.05,"학교 위치 확인 중…");
  schoolLatLng=await resolveLL(SCHOOL);
  const sm=L.marker(schoolLatLng,{icon:schoolIcon(),zIndexOffset:1000}).addTo(map);
  sm.bindPopup(`<b>🏫 ${SCHOOL.name}</b><br>모든 노선의 도착지/출발지`);
  await buildDirection("going");
  Object.keys(layers.going).forEach(function(rid){ layers.going[rid].addTo(map); });  // 첫 화면에 노선 표시
  showOverlay(false);
  renderPanel(); updateLegend(); updateDirNote();
  fitActive();
  startBusPolling();   // 실시간 버스 위치 표시 시작
  if(cachedMeta) applyCounts();   // 캐시로 먼저 그렸으니 최신 인원수·정류장 정보를 뒤에서 갱신
}

function stopsOf(route,dir){ return dir==="going"?route.going:route.coming; }

/* 경로 계산용 경유점 목록을 만든다.
 * 실제 버스가 자동계산 경로와 다른 길로 가는 구간이 있어(1호차 마유로 등),
 * 경유지를 "특정 정류장 다음"에 끼울 수 있어야 한다.
 * after 가 없는 경유지는 예전처럼 마지막 정류장과 학교 사이에 들어간다(4호차 고속도로 회피).
 * stopIdx[i] = i번째 정류장이 wpts 안에서 몇 번째인지 → 소요시간 계산에 쓴다. */
function buildWaypoints(stops, viaPts, dir){
  const wpts=[], stopIdx=[], byAfter={}, tail=[];
  (viaPts||[]).forEach(v=>{
    let key=v.after;
    if(!key){
      /* 관리자 모드에서 지도에 찍은 경유지는 "어느 정류장 다음"인지 정보가 없다.
       * 가장 가까운 정류장(또는 학교) 뒤에 넣는다 — 도로 위에 점만 찍으면
       * 알맞은 구간에 자동으로 끼워지므로, 중간 구간도 손으로 고칠 수 있다. */
      let best=null;
      stops.forEach(st=>{
        if(!st._ll) return;
        const d=haversine([v.lat,v.lng], st._ll);
        if(!best || d<best.d) best={d, code:st.code};
      });
      if(schoolLatLng){
        const ds=haversine([v.lat,v.lng], schoolLatLng);
        if(!best || ds<best.d) best=null;        // 학교가 더 가까우면 마지막(학교 직전)에 둔다
      }
      key = best ? best.code : "";
    }
    if(key) (byAfter[key]=byAfter[key]||[]).push([v.lat,v.lng]);
    else tail.push([v.lat,v.lng]);
  });
  if(dir!=="going"){
    wpts.push(schoolLatLng);
    tail.slice().reverse().forEach(p=>wpts.push(p));
  }
  stops.forEach(s=>{
    stopIdx.push(wpts.length); wpts.push(s._ll);
    (byAfter[s.code]||[]).forEach(p=>wpts.push(p));
  });
  if(dir==="going"){
    tail.forEach(p=>wpts.push(p));
    wpts.push(schoolLatLng);
  }
  return {wpts:wpts, stopIdx:stopIdx};
}

function keyOf(dir,route,s){ return dir==="going" ? s.code : ("c"+route.id+"-"+s.seq); }

// ---- 한 방향(등교/하교) 지도 구성 -----------------------------------
async function buildDirection(dir){
  if(built[dir]) return;
  showOverlay(true); setProgress(0.05, dir==="going"?"등교 노선 준비 중…":"하교 노선 준비 중…");
  const routes=META.routes;
  const totalStops=routes.reduce((n,r)=>n+stopsOf(r,dir).length,0);
  // 좌표 확보 — 내장/실측 좌표를 쓰므로 즉시 끝난다(예전엔 여기서 정류장마다 1.1초씩 기다렸다)
  setProgress(0.15, `정류장 위치 확인 (${totalStops}곳)`);
  await Promise.all(routes.map(r=>Promise.all(stopsOf(r,dir).map(async s=>{ s._ll=await resolveLL(s); }))));

  // 노선별 경로/시간 — 4개 노선을 동시에 요청하고, 결과는 폰에 저장해 다음 접속 때 재사용
  setProgress(0.35, "노선 경로 계산 중…");
  const plans = routes.map(r=>{
    const stops=stopsOf(r,dir);
    const viaPts=(r.via||[]);
    const built=buildWaypoints(stops, viaPts, dir);
    const wpts=built.wpts, stopIdx=built.stopIdx;
    const key = "rt|"+dir+"|"+r.id+"|"+(r.avoid||"")+"|"+wpts.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(";");
    return {r:r, stops:stops, viaPts:viaPts, wpts:wpts, stopIdx:stopIdx, key:key, cached:lsGet(key)};
  });
  let fetched=0;
  const results = await Promise.all(plans.map(async pl=>{
    if(pl.cached) return pl.cached;                       // 저장된 경로 재사용(7일)
    try{
      const rr=await osrmRoute(pl.wpts, pl.r.avoid?{exclude:pl.r.avoid}:{});
      lsSet(pl.key,{geometry:rr.geometry,legDur:rr.legDur});
      return {geometry:rr.geometry,legDur:rr.legDur};
    }catch(e){
      try{
        if(!pl.r.avoid) throw e;
        const r2=await osrmRoute(pl.wpts);                // 고속도로 회피가 거부되면 일반 경로로 재시도
        lsSet(pl.key,{geometry:r2.geometry,legDur:r2.legDur});
        return {geometry:r2.geometry,legDur:r2.legDur};
      }catch(e2){ return {geometry:pl.wpts.slice(),legDur:null}; }   // 실패하면 직선으로 표시
    }finally{ setProgress(0.35+0.55*(++fetched/plans.length), "노선 경로 계산 중…"); }
  }));

  for(let pi=0; pi<plans.length; pi++){
    const r=plans[pi].r, stops=plans[pi].stops, wpts=plans[pi].wpts, stopIdx=plans[pi].stopIdx;
    const lg=L.layerGroup(); layers[dir][r.id]=lg;
    const geometry=results[pi].geometry, legDur=results[pi].legDur;
    L.polyline(geometry,{color:"#fff",weight:9,opacity:.25}).addTo(lg);
    L.polyline(geometry,{color:r.color,weight:5,opacity:.78}).addTo(lg);
    stops.forEach((s,i)=>{
      let eta=null;
      // 경유지가 정류장 사이에 끼어도 맞도록, 그 정류장의 실제 경유점 위치(stopIdx)로 계산한다
      const wi=stopIdx[i];
      if(legDur){
        eta = dir==="going" ? legDur.slice(wi).reduce((a,b)=>a+b,0)              // 정류장→학교
                            : legDur.slice(0,wi).reduce((a,b)=>a+b,0);           // 학교→정류장
      }else{
        const seq = dir==="going" ? wpts.slice(wi) : wpts.slice(0,wi+1);
        let d=0; for(let k=0;k<seq.length-1;k++) d+=haversine(seq[k],seq[k+1]); eta=d/(22000/3600);
      }
      s._eta=eta;
      const label = dir==="going" ? cnt(s) : s.seq;
      const m=L.marker(s._ll,{icon:numIcon(r.color,label),draggable:true}).addTo(lg);
      // 지도에 올라오는 시점에 관리자 모드가 아니면 드래그 비활성화(확실히)
      m.on("add",function(){ if(!adminMode && this.dragging) this.dragging.disable(); });
      if(m.dragging && !adminMode) m.dragging.disable();
      m.bindPopup(popupHtml(r,s,dir));
      m._ars=s.ars; m._stop=s;
      m.on("dragend",onStopDragEnd);
      markers[dir][keyOf(dir,r,s)]=m;
    });
  }
  built[dir]=true;
}

function popupHtml(r,s,dir){
  if(dir==="going"){
    return `<b style="color:${r.color}">${r.name} · 등교</b><br>
      <b>${s.code}. ${s.name}</b>${s.shared?` <span class="badge">${s.shared}</span>`:""}${s.note?`<br><span style="color:#888">${s.note}</span>`:""}<br>
      정류소번호 ${s.ars} · 알림 신청 <b>${cnt(s)}명</b>
      <div class="pop-t"><span class="eta">학교까지 ${fmtMin(s._eta)}</span></div>`;
  }
  const dep=META.comingDepart||{};
  const depTxt=Object.keys(dep).map(k=>`${k} ${dep[k]}`).join(" / ");
  return `<b style="color:${r.color}">${r.name} · 하교</b><br>
    <b>${s.seq}. ${s.name}</b><br>정류소번호 ${s.ars}
    <div class="pop-t"><span class="eta">🏫 학교 출발 후 약 ${fmtMin(s._eta).replace("약 ","")} 도착 예정</span></div>
    <div style="font-size:11px;color:#888;margin-top:3px">하교 출발: ${depTxt}</div>`;
}

// ---- 방향 전환 -----------------------------------------------------
async function setDirection(dir){
  if(dir===activeDir && built[dir]) return;
  if(!built[dir]) await buildDirection(dir);
  // 레이어 교체
  ["going","coming"].forEach(d=>{
    Object.keys(layers[d]).forEach(rid=>{ const lg=layers[d][rid];
      if(d===dir){ if(!map.hasLayer(lg)) lg.addTo(map); } else { if(map.hasLayer(lg)) map.removeLayer(lg); }
    });
  });
  activeDir=dir;
  document.getElementById("tabGo").classList.toggle("on",dir==="going");
  document.getElementById("tabCome").classList.toggle("on",dir==="coming");
  showOverlay(false);
  renderPanel(); updateLegend(); updateDirNote(); fitActive();
}
function fitActive(){
  const pts=[schoolLatLng];
  META.routes.forEach(r=>stopsOf(r,activeDir).forEach(s=>{ if(s._ll)pts.push(s._ll); }));
  if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(0.12));
}
function updateDirNote(){
  const el=document.getElementById("dirNote");
  if(activeDir==="going") el.innerHTML="학교에는 9:00까지 도착합니다. 정류장 통과 시각은 교통 상황에 따라 매일 달라서 따로 표시하지 않고, 버스가 가까워지면 알림으로 알려드립니다.";
  else{ const d=META.comingDepart||{}; el.innerHTML="하교는 반대편 정류장으로 운행합니다. 출발: "+Object.keys(d).map(k=>k+" "+d[k]).join(" / ")+".";}
}

// ---- 좌측 목록 -----------------------------------------------------
function renderPanel(){
  const box=document.getElementById("routes"); box.innerHTML="";
  META.routes.forEach((r,idx)=>{
    const stops=stopsOf(r,activeDir);
    const total=activeDir==="going"?stops.reduce((n,s)=>n+cnt(s),0):null;
    const meta=activeDir==="going"?`${stops.length}개 · 알림 ${total}명${r.avoid?" · 고속도로 미이용":""}`
                                  :`${stops.length}개 정류장${r.avoid?" · 고속도로 미이용":""}`;
    const div=document.createElement("div");div.className="route"+(idx===0?" open":"");
    div.innerHTML=`<h2><input type="checkbox" checked><span class="dot" style="background:${r.color}"></span>${r.name}
        <span class="meta">${meta}</span></h2>
      <ul class="stops">${stops.map(s=>{
        const key=keyOf(activeDir,r,s);
        if(activeDir==="going"){
          return `<li data-key="${key}"><div class="nm">${s.code}. ${s.name}${s.shared?` <span class="badge">${s.shared}</span>`:""}</div>
            <div class="sub"><span class="badge">🔔 ${cnt(s)}</span>
            <span class="eta">🏫 ${fmtMin(s._eta)}</span></div></li>`;
        }
        return `<li data-key="${key}"><div class="nm">${s.seq}. ${s.name}</div>
          <div class="sub"><span>정류소 ${s.ars}</span><span class="eta">🏫 출발 후 ${fmtMin(s._eta)}</span></div></li>`;
      }).join("")}</ul>`;
    box.appendChild(div);
    div.querySelector("h2").addEventListener("click",e=>{if(e.target.tagName==="INPUT")return;div.classList.toggle("open");});
    div.querySelector("input").addEventListener("change",e=>{const lg=layers[activeDir][r.id];if(!lg)return;e.target.checked?lg.addTo(map):map.removeLayer(lg);});
    div.querySelectorAll("li").forEach(li=>li.addEventListener("click",()=>focusKey(li.dataset.key,false)));
  });
}
function updateLegend(){
  let html=META.routes.map(r=>`<div><span class="dot" style="background:${r.color}"></span>${r.name}</div>`).join("")
    +`<div><span style="width:14px;text-align:center">🏫</span>한국글로벌중학교</div>`;
  if(activeDir==="going"){
    const grand=META.routes.reduce((n,r)=>n+r.going.reduce((m,s)=>m+cnt(s),0),0);
    html+=`<div style="margin-top:4px;border-top:1px solid #eee;padding-top:4px;color:#555">등교 알림 신청 ${grand}명</div>`;
  }else{
    html+=`<div style="margin-top:4px;border-top:1px solid #eee;padding-top:4px;color:#555">하교 (반대편 정류장)</div>`;
  }
  document.getElementById("legend").innerHTML=html;
}
function focusKey(key,highlight){
  document.querySelectorAll(".stops li").forEach(li=>li.classList.toggle("hl",highlight&&li.dataset.key===key));
  const m=markers[activeDir][key]; if(!m)return;
  const lg=findLayerForKey(key);
  if(lg&&!map.hasLayer(lg))lg.addTo(map);
  if(isMobile()) setMobileView('map');           // 모바일: 선택하면 지도로 전환
  setTimeout(()=>{ map.setView(m.getLatLng(),16,{animate:true}); m.openPopup(); },70);
}
function findLayerForKey(key){
  for(const r of META.routes){ if(stopsOf(r,activeDir).some(s=>keyOf(activeDir,r,s)===key)) return layers[activeDir][r.id]; }
  return null;
}

// ---- 알림 구독 (학교 구글 계정 로그인) ------------------------------
// 명단·조회코드를 쓰지 않는다. 로그인으로 본인 확인하고, 저장하는 건 [계정 + 노선 + 정류장]뿐.
let ID_TOKEN=null, MY_EMAIL="";

/* 로그인 유지 —
 * 구글 ID 토큰은 약 1시간이면 만료되고 앱을 닫으면 사라진다. 그래서 열 때마다 다시
 * 로그인해야 했고(2026-09-21 실운영), 학생들은 재로그인을 안 하니 알림 지연 기록도
 * 올라오지 않았다. 지금은 한 번 로그인하면 서버가 90일짜리 세션 토큰을 발급하고
 * 그 값을 이 기기에 보관한다. 이후에는 로그인 화면 없이 바로 설정 화면이 열린다.
 * 토큰은 서버 비밀키로 서명돼 있어 내용을 고치면 즉시 무효가 된다. */
const SESS_KEY="kgmsbusSession1";
function sessGet(){ try{ return localStorage.getItem(SESS_KEY)||""; }catch(e){ return ""; } }
function sessSet(t){ try{ t?localStorage.setItem(SESS_KEY,t):localStorage.removeItem(SESS_KEY); }catch(e){} }

function fillRouteSel(sel){
  sel.innerHTML=`<option value="0">— 안 받음 —</option>`
    +META.routes.map(r=>`<option value="${r.id}">${r.name.replace(/\s*\(.*\)/,"")}</option>`).join("");
}
function fillStopSel(sel,routeId,dir){
  const r=META.routes.find(x=>x.id===Number(routeId));
  if(!r){sel.innerHTML=`<option value="">—</option>`;return;}
  const list=dir==="coming"?r.coming:r.going;
  sel.innerHTML=list.map(s=>`<option value="${s.code}">${s.name}</option>`).join("");
}

// 로그인 버튼 영역 그리기
function renderSignIn(errMsg){
  const box=document.getElementById("signInBox");
  if(!window.BUS_CONFIG){                     // Apps Script 내부 화면(관리자용)
    box.innerHTML=`<div style="font-size:11.5px;color:#b45309;line-height:1.55">
      이 화면에서는 알림 설정을 할 수 없습니다.<br>학교에서 안내한 <b>알림 사이트 주소</b>로 접속해 주세요.</div>`;
    return;
  }
  box.innerHTML=`<div id="gsiBtn"></div>`
    +(errMsg?`<div style="margin-top:7px;font-size:11.5px;color:#b91c1c">${errMsg}</div>`:"");
  if(window.__renderSignIn) window.__renderSignIn(document.getElementById("gsiBtn"));
  else setTimeout(()=>{ if(window.__renderSignIn) window.__renderSignIn(document.getElementById("gsiBtn")); }, 400);
}

// push-client.html 이 로그인 성공 시 호출
async function onSignedIn(idToken){
  const box=document.getElementById("fResult");
  box.className="result";box.style.display="block";box.textContent="계정을 확인하는 중…";
  try{
    // 구글 로그인 1회 → 90일 세션 발급. 이후 요청은 세션 토큰으로 한다.
    let tok=idToken;
    try{
      const lg=await gcall("login",idToken);
      if(lg && lg.session){ tok=lg.session; sessSet(tok); }
    }catch(e){ /* 세션 발급 실패해도 이번 접속은 ID 토큰으로 진행 */ }
    const sub=await gcall("getSubscription",tok);
    ID_TOKEN=tok; MY_EMAIL=sub.email||"";
    document.getElementById("signInBox").innerHTML=
      `<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:#475569">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">로그인: <b>${MY_EMAIL}</b></span>
        <button id="signOutBtn" style="padding:4px 10px;font-size:11.5px;background:#e5e7eb;color:#374151">로그아웃</button>
      </div>`;
    document.getElementById("signOutBtn").onclick=signOut;
    renderSubForm(sub);
  }catch(e){
    ID_TOKEN=null; sessSet("");
    const m=String((e&&e.message)||e);
    box.style.display="none";
    const dom=(window.BUS_CONFIG&&window.BUS_CONFIG.allowedDomain)||"";
    renderSignIn(m.indexOf("domain")>=0
      ? "학교 계정"+(dom?"(@"+dom+")":"")+"으로만 이용할 수 있습니다. 학교 계정으로 다시 로그인해 주세요."
      : "로그인 확인에 실패했습니다. 다시 시도해 주세요. (코드: "+m.replace(/^Error:\s*/,"")+")");
  }
}

// 로그아웃: 이 화면의 로그인 상태만 지운다. (구독 설정과 알림은 그대로 유지됨)
function signOut(){
  ID_TOKEN=null; MY_EMAIL=""; sessSet("");
  const box=document.getElementById("fResult");
  box.style.display="none"; box.innerHTML="";
  if(window.__signOut) try{ window.__signOut(); }catch(e){}
  renderSignIn();
}

function renderSubForm(sub){
  const box=document.getElementById("fResult");
  box.className="result ok";
  box.innerHTML=`
    <div style="font-weight:700;margin-bottom:6px">내가 받을 알림</div>
    <div style="display:grid;grid-template-columns:34px 1fr;gap:5px 6px;align-items:center;font-size:12px">
      <span>등교</span><span style="display:flex;gap:4px"><select id="agRoute" style="flex:1;min-width:0;font-size:11.5px;padding:4px"></select><select id="agStop" style="flex:1;min-width:0;font-size:11.5px;padding:4px"></select></span>
      <span>하교</span><span style="display:flex;gap:4px"><select id="acRoute" style="flex:1;min-width:0;font-size:11.5px;padding:4px"></select><select id="acStop" style="flex:1;min-width:0;font-size:11.5px;padding:4px"></select></span>
    </div>
    <div style="display:flex;gap:5px;margin-top:8px">
      <button id="alertSave" style="flex:1">저장</button>
      <button id="alertOff" style="background:#e5e7eb;color:#374151">알림 끄기</button>
    </div>
    <div id="alertMsg" style="margin-top:6px;font-size:11.5px;color:#555"></div>
    <div id="alertWrap"></div>
    <div id="fbWrap" style="margin-top:10px;border-top:1px dashed #a7f3d0;padding-top:9px">
      <div style="font-weight:700;margin-bottom:4px">🧪 베타테스트 의견</div>
      <div style="font-size:11.5px;color:#6b7280;margin-bottom:6px">알림을 받아본 뒤 눌러주세요. 선생님에게 전달됩니다.</div>
      <div style="display:flex;gap:4px">
        <button class="fbBtn" data-kind="good" style="flex:1;min-width:0;font-size:11.5px;padding:7px 4px">👍 잘 왔어요</button>
        <button class="fbBtn" data-kind="late" style="flex:1;min-width:0;font-size:11.5px;padding:7px 4px;background:#b45309">🐢 늦게 왔어요</button>
        <button class="fbBtn" data-kind="none" style="flex:1;min-width:0;font-size:11.5px;padding:7px 4px;background:#b91c1c">✖ 안 왔어요</button>
      </div>
      <div style="display:flex;gap:4px;margin-top:5px">
        <input id="fbNote" placeholder="한 줄 의견(선택)" maxlength="200" style="flex:1;min-width:0;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px">
        <button class="fbBtn" data-kind="etc" style="font-size:11.5px;padding:7px 10px;background:#475569">보내기</button>
      </div>
      <div id="fbMsg" style="margin-top:6px;font-size:11.5px;color:#555"></div>
    </div>`;

  const gR=document.getElementById("agRoute"),gS=document.getElementById("agStop");
  const cR=document.getElementById("acRoute"),cS=document.getElementById("acStop");
  const msg=document.getElementById("alertMsg");
  const sync=(rSel,sSel,dir)=>{ if(Number(rSel.value))fillStopSel(sSel,rSel.value,dir); else sSel.innerHTML=`<option value="">—</option>`; };
  fillRouteSel(gR); fillRouteSel(cR);
  gR.onchange=()=>sync(gR,gS,"going"); cR.onchange=()=>sync(cR,cS,"coming");

  gR.value=String(sub.goingRoute||0); sync(gR,gS,"going"); if(sub.goingStop)gS.value=sub.goingStop;
  cR.value=String(sub.comingRoute||0); sync(cR,cS,"coming"); if(sub.comingStop)cS.value=sub.comingStop;
  msg.textContent=sub.subscribed?"저장된 설정입니다. 바꾸면 저장을 눌러 주세요."
                                :"타는 노선과 정류장을 고르고 저장하세요.";

  document.getElementById("alertSave").onclick=async ()=>{
    const btn=document.getElementById("alertSave");
    btn.disabled=true; msg.textContent="저장 중…";
    try{
      const res=await gcall("subscribe",ID_TOKEN,
        Number(gR.value)||0, Number(gR.value)?gS.value:"",
        Number(cR.value)||0, Number(cR.value)?cS.value:"");

      await gcall("unsubscribe",ID_TOKEN);

var busMarkers={};
function busDivIcon(color){
  return L.divIcon({className:"",iconSize:[36,36],iconAnchor:[18,18],
    html:'<div style="position:relative;width:36px;height:36px">'
       + '<div style="position:absolute;inset:0;border:3px solid '+color+';background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>'
       + '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px">🚌</div></div>'});
}
async function pollBusLive(){
  if(document.hidden || !META) return;
  try{
    var live=await gcall("getBusLive");
    // 실시간 채널이 더 최신이면 폴링 결과로 되돌리지 않는다
    if(liveStamp && Date.now()-liveStamp < 20000) return;
    renderBusLive(live);
  }catch(e){}
}

var liveStamp=0;
function renderBusLive(live){
  if(!META) return;
  if(!Array.isArray(live)) return;
  liveStamp=Date.now();
  var seen={};
  live.forEach(function(b){
    seen[b.routeId]=true;
    var route=META.routes.find(function(r){return r.id===b.routeId;});
    var color=route?route.color:"#111"; var ll=[b.lat,b.lng];
    if(busMarkers[b.routeId]) busMarkers[b.routeId].setLatLng(ll);
    else busMarkers[b.routeId]=L.marker(ll,{icon:busDivIcon(color),zIndexOffset:2000}).addTo(map);
    // 위치가 오래된 것을 숨기지 않는다 — 흐리게 표시해 "지금 여기"가 아님을 알린다.
    var stale=b.ageSec>20;
    try{ busMarkers[b.routeId].setOpacity(stale?0.45:1); }catch(e){}
    busMarkers[b.routeId].bindPopup('<b style="color:'+color+'">'+(route?route.name:('노선 '+b.routeId))+'</b><br>🚌 운행 중'
      +(b.dir?(' ('+b.dir+')'):'')
      +(b.spdKmh?('<br>속도 약 '+b.spdKmh+' km/h'):'')
      +'<br>'+(stale?'⚠ 신호 끊김 — ':'')+'위치 갱신 '+b.ageSec+'초 전');
  });
  Object.keys(busMarkers).forEach(function(rid){ if(!seen[rid]){ map.removeLayer(busMarkers[rid]); delete busMarkers[rid]; } });
}

/* 버스 위치 받기 —
 *  ① Firebase 실시간 채널(web/live-client.html)이 있으면 웹소켓으로 즉시 받는다(1초 이내).
 *  ② 없으면 Apps Script 를 5초마다 물어본다(6~12초 뒤처짐. 2026-09-18 실측).
 * 실시간 채널을 쓰는 경우에도 30초마다 한 번은 서버를 확인해, RTDB 가 비어 있는 동안에도
 * (예: 기사 기기가 Firebase 로그인에 실패한 경우) 버스가 지도에서 사라지지 않게 한다. */
function startBusPolling(){
  var usingLive=false, pollTimer=null, tries=0;

  function setPoll(ms){ if(pollTimer) clearInterval(pollTimer); pollTimer=setInterval(pollBusLive, ms); }

  function attachLive(){
    if(usingLive) return true;
    if(typeof window.__liveSubscribe!=="function") return false;
    usingLive = window.__liveSubscribe(function(list){ renderBusLive(list); }) !== false;
    if(usingLive) setPoll(30000);            // 실시간이 주 채널 → 서버 확인은 예비로만
    return usingLive;
  }

  // ⚠ 실시간 채널은 문서 뒷부분에서 SDK를 받아온 뒤에 준비된다.
  //   재방문 때는 노선 경로가 캐시돼 있어 init() 이 SDK 로드보다 먼저 끝나므로,
  //   여기서 한 번만 확인하면 폴링으로 떨어져 버스가 수십 초 뒤에나 나타난다(실제로 그랬다).
  //   준비될 때까지 최대 20초간 다시 시도한다.
  if(!attachLive()){
    setPoll(5000);
    var t=setInterval(function(){ if(attachLive() || ++tries>40) clearInterval(t); }, 500);
  }
  pollBusLive();
}

init().catch(err=>{document.getElementById("ovMsg").textContent="지도를 불러오지 못했습니다. 새로고침 해주세요.";});

<!-- 외부 호스팅 빌드 전용: 웹푸시(FCM) 클라이언트 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
(function(){
  var CFG=window.BUS_CONFIG||{}, messaging=null, swReg=null, gisInited=false;
  var LSKEY='busPushToken';

  // 아이패드(iPadOS 13+)는 맥으로 위장하므로 터치 지원 여부로 한 번 더 판별
  var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)
         || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var standalone=(window.navigator.standalone===true)||window.matchMedia('(display-mode: standalone)').matches;
  var IOS_GUIDE='📱 <b>아이폰은 홈 화면에 추가해야 알림을 받을 수 있습니다.</b><br>'
    +'① 사파리 하단 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → 추가<br>'
    +'② 홈 화면에 생긴 <b>통학버스</b> 아이콘으로 다시 열기<br>'
    +'③ 다시 로그인한 뒤 이 버튼 누르기<br>'
    +'<span style="color:#94a3b8">iOS 16.4 이상 필요 · 설정 → 일반 → 정보에서 확인</span>';

  function canPush(){
    return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  }

  async function initFCM(){
    if(messaging) return messaging;
    if(!CFG.firebase || !CFG.firebase.apiKey) throw new Error('firebase 설정이 비어 있습니다 (config.js)');
    if(!CFG.vapidKey) throw new Error('vapidKey 가 비어 있습니다 (config.js)');
    if(!firebase.apps.length){
      // 실시간 지도(RTDB)와 같은 앱 인스턴스를 쓰도록 databaseURL 도 함께 넣는다
      var opts={}; Object.keys(CFG.firebase).forEach(function(k){ opts[k]=CFG.firebase[k]; });
      if(CFG.rtdbUrl) opts.databaseURL=CFG.rtdbUrl;
      firebase.initializeApp(opts);
    }
    swReg = await navigator.serviceWorker.getRegistration('firebase-messaging-sw.js')
         || await navigator.serviceWorker.register('firebase-messaging-sw.js');
    messaging = firebase.messaging();   // 토큰 발급 용도로만 사용(표시는 서비스워커가 담당)
    return messaging;
  }

  async function enable(status, btn){
    btn.disabled=true;
    try{
      if(isIOS && !standalone){ status.innerHTML=IOS_GUIDE; btn.disabled=false; return; }
      if(!canPush()) throw new Error('이 브라우저는 웹 알림을 지원하지 않습니다.');
      status.textContent='알림 권한을 확인합니다…';
      var perm=await Notification.requestPermission();
      if(perm!=='granted'){
        status.textContent='알림이 허용되지 않았습니다. 브라우저 설정에서 이 사이트의 알림을 허용해 주세요.';
        btn.disabled=false; return;
      }
      status.textContent='기기를 등록하는 중…';
      await initFCM();
      var token=await messaging.getToken({vapidKey:CFG.vapidKey, serviceWorkerRegistration:swReg});
      if(!token) throw new Error('기기 토큰을 받지 못했습니다.');
      await gcall('savePushToken', ID_TOKEN, token);
      try{ localStorage.setItem(LSKEY, token); }catch(e){}
      status.innerHTML='✅ 이 기기로 알림을 받습니다. 앱을 닫아도 알림이 옵니다.';
      btn.textContent='📲 이 기기 알림 켜짐';
    }catch(err){
      status.textContent='알림 설정 실패: '+((err&&err.message)||err);
      btn.disabled=false;
    }
  }

  /* ---- 학교 구글 계정 로그인 (Google Identity Services) ----
   * 로그인 성공 시 ID 토큰을 Index.html 의 onSignedIn() 으로 넘긴다.
   * 서버(Auth.gs)가 그 토큰의 진위와 학교 도메인을 검증한다.
   */
  window.__renderSignIn=function(el){
    if(!el) return;
    if(!CFG.googleClientId){
      el.innerHTML='<div style="font-size:11.5px;color:#b91c1c">config.js 의 googleClientId 를 설정해 주세요.</div>';
      return;
    }
    if(!(window.google && google.accounts && google.accounts.id)){
      el.innerHTML='<div style="font-size:11.5px;color:#6b7280">로그인 모듈을 불러오는 중…</div>';
      setTimeout(function(){ window.__renderSignIn(el); }, 600);
      return;
    }
    // initialize() 는 페이지당 한 번만. 여러 번 부르면 버튼을 눌러도 콜백이 오지 않는 경우가 있다.
    if(!gisInited){
      google.accounts.id.initialize({
        client_id: CFG.googleClientId,
        hd: CFG.allowedDomain || undefined,      // 학교 도메인 계정만 보이도록 힌트(강제는 서버가 함)
        ux_mode: 'popup',
        itp_support: true,                       // 사파리/아이폰 추적방지 환경 대응
        callback: function(res){
          if(res && res.credential && typeof onSignedIn==='function') onSignedIn(res.credential);
          else alert('구글 로그인 응답을 받지 못했습니다. 다시 시도해 주세요.');
        }
      });
      gisInited=true;
    }
    el.innerHTML='';
    google.accounts.id.renderButton(el, {theme:'outline', size:'large', text:'signin_with', locale:'ko', width:260});
  };

  /* 기기가 기록해 둔 "알림 받은 시각"을 서버로 올린다(지연 자동 수집).
     서버 발송 시각은 푸시 안에 담겨 오므로, 학생은 아무것도 하지 않아도 지연이 초 단위로 기록된다. */
  window.__reportDelays=function(idToken){
    if(!idToken || !('caches' in window)) return;
    caches.open('bus-diag').then(function(c){
      return c.match('delay-queue').then(function(r){ return r ? r.json() : []; }).then(function(list){
        if(!list || !list.length) return;
        return gcall('reportPushDelay', idToken, list).then(function(){
          return c.delete('delay-queue');        // 서버가 받았으면 비운다(중복은 서버에서도 걸러짐)
        });
      });
    }).catch(function(){});
  };

  // 로그아웃 시: 다음 방문 때 같은 계정으로 자동 로그인되지 않게 하고, 계정 선택창을 다시 띄운다.
  window.__signOut=function(){
    try{ if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  };

  // Index.html 의 renderSubForm() 이 호출하는 훅
  window.__pushHook=function(wrap){
    if(!wrap || wrap.querySelector('#pushBtn')) return;
    var box=document.createElement('div');
    box.style.marginTop='9px';
    box.style.borderTop='1px dashed #a7f3d0';
    box.style.paddingTop='8px';
    box.innerHTML='<button id="pushBtn">📲 이 기기에서 알림 받기</button>'
      +'<div id="pushMsg" style="margin-top:6px;font-size:11.5px;color:#555"></div>';
    wrap.appendChild(box);
    var btn=box.querySelector('#pushBtn'), msg=box.querySelector('#pushMsg');

    // 아이폰은 사파리 "탭"에서 푸시 기능 자체를 숨긴다(PushManager 없음).
    // 그래서 "지원 여부"보다 "홈 화면 앱으로 열었는지"를 먼저 판단해야 올바른 안내가 나간다.
    if(isIOS && !standalone){
      msg.innerHTML=IOS_GUIDE;
      btn.disabled=true; return;
    }
    if(!canPush()){
      msg.innerHTML = isIOS
        ? '이 아이폰은 웹 알림을 지원하지 않습니다. <b>iOS 16.4 이상</b>으로 업데이트해 주세요.<br>(설정 → 일반 → 소프트웨어 업데이트)'
        : '이 브라우저는 웹 알림을 지원하지 않습니다. <b>크롬</b>이나 <b>삼성 인터넷</b>으로 열어 주세요.';
      btn.disabled=true; return;
    }
    if(Notification.permission==='granted'){
      var saved=''; try{ saved=localStorage.getItem(LSKEY)||''; }catch(e){}
      if(saved){ btn.textContent='📲 이 기기 알림 켜짐'; msg.textContent='이미 이 기기로 알림을 받고 있습니다.'; }
      else msg.textContent='알림 권한은 있습니다. 버튼을 눌러 이 기기를 등록해 주세요.';
    }else if(Notification.permission==='denied'){
      msg.innerHTML=isIOS
        ? '알림이 꺼져 있습니다. <b>설정 → 알림 → 통학버스</b>에서 알림 허용을 켜 주세요.'
        : '알림이 차단되어 있습니다. 주소창 왼쪽 <b>자물쇠 아이콘 → 알림 → 허용</b>으로 바꿔 주세요.';
    }
    btn.onclick=function(){ enable(msg, btn); };

    // 진단: 이 기기가 마지막으로 받은 푸시(서비스워커가 기록) 표시
    var diag=document.createElement('div');
    diag.style.cssText='margin-top:6px;font-size:11px;color:#94a3b8';
    box.appendChild(diag);
    function showDiag(){
      if(!('caches' in window)) return;
      caches.open('bus-diag').then(function(c){ return c.match('last-push'); })
        .then(function(r){ return r ? r.json() : null; })
        .then(function(d){
          // 실행 위치를 함께 밝힌다. 아이폰은 iOS 16.4부터 홈 화면 앱과 사파리 탭의 저장소가
          // 분리되어 있어, 알림은 홈 화면 앱이 받았는데 사파리 탭에서 확인하면
          // "받은 적 없음 / 알림 설정 안 됨"으로 보인다(실차 테스트에서 실제로 혼동됨).
          var where = standalone ? '홈 화면 앱' : (isIOS ? '사파리 탭' : '브라우저');
          var head = '실행 위치: '+where;
          if(isIOS && !standalone) head += ' ⚠ 알림은 홈 화면 앱에서만 받습니다(설정·기록도 따로입니다)';
          if(!d){ diag.textContent=head+' · 이 실행 환경이 받은 알림: 아직 없음'; return; }
          var t=new Date(d.at), hh=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
          diag.textContent=head+' · 마지막 수신 '+(t.getMonth()+1)+'/'+t.getDate()+' '+hh
            +(d.shown ? ' · 화면 표시 성공' : ' · 도착했지만 표시 실패('+(d.error||'?')+')');
        }).catch(function(){});
    }
    showDiag();
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') showDiag(); });
  };

  // 서비스워커는 의존성이 없으므로 미리 등록해 둔다(설정 전에도 실패하지 않음).
  window.addEventListener('load', function(){
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(e){
        console.warn('서비스워커 등록 실패:', e);
      });
    }
  });
  // 앱이 열려 있을 때 온 푸시도 서비스워커가 알림으로 표시한다(별도 처리 불필요).
})();
</script>

<!-- 실시간 버스 위치 수신 (Firebase Realtime Database)
     Apps Script 폴링은 6~40초 뒤처진다(2026-09-18 실측. 기사 폰이 5초마다 busPing 을 보내는 동안
     Apps Script 실행이 줄을 서기 때문). 여기서는 웹소켓으로 즉시 받는다.
     RTDB 설정이 없으면 아무것도 하지 않고, 지도는 예전 폴링 방식으로 계속 동작한다.
     읽기 전용이다 — 쓰기는 기사 기기(driver 클레임)만 가능하도록 RTDB 규칙에서 막혀 있다. -->
<!-- firebase-app-compat 은 push-client 가 이미 불러온다. 두 번 불러오면 window.firebase 가
     교체되어 database 가 등록된 인스턴스를 잃는다. 여기서는 database 만 추가로 얹는다. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  var CFG = (window.BUS_CONFIG || {});
  var url = CFG.rtdbUrl;
  if (!url) return;                       // 미설정 → 폴링 유지

  var latest = {};                        // routeId → 마지막 기록
  var subs = [];                          // 지도에서 등록한 콜백들
  var started = false;

  function snapshotList() {
    var now = Date.now(), out = [];
    Object.keys(latest).forEach(function (rid) {
      var v = latest[rid];
      if (!v || !isFinite(v.lat) || !isFinite(v.lng) || !v.ts) return;
      var age = (now - v.ts) / 1000;
      if (age > 90) return;               // 오래된 신호는 지도에서 제거
      out.push({ routeId: Number(rid), lat: v.lat, lng: v.lng,
                 ageSec: Math.round(age), dir: v.dir || '', spdKmh: v.spdKmh || 0 });
    });
    return out;
  }

  // 값이 안 바뀌어도 "N초 전" 표시가 멈추지 않도록 1초마다 다시 넘긴다.
  function emit() {
    var list = snapshotList();
    for (var i = 0; i < subs.length; i++) {
      try { subs[i](list); } catch (e) {}
    }
  }

  /* ★ 스크립트가 로드되는 즉시 구독을 시작한다.
     지도(init)가 이 스크립트보다 먼저 끝나는 경우가 있어(재방문 시 노선 경로가 캐시됨),
     "지도가 부를 때 구독 시작" 방식으로는 버스가 수십 초 뒤에나 나타났다.
     여기서 먼저 받아두면, 지도가 나중에 붙어도 곧바로 현재 위치를 넘겨줄 수 있다. */
  function start() {
    if (started) return true;
    if (!window.firebase || !firebase.database) return false;
    // 전체 firebase 설정에 databaseURL 만 더해 초기화한다.
    // apiKey 만 넣고 초기화하면 push-client 가 initializeApp 을 건너뛰어
    // projectId/messagingSenderId 가 없는 앱으로 FCM 토큰 발급이 실패한다.
    if (!firebase.apps.length) {
      var opts = {}, base = CFG.firebase || {};
      Object.keys(base).forEach(function (k) { opts[k] = base[k]; });
      opts.databaseURL = url;
      firebase.initializeApp(opts);
    }
    var ref = firebase.database().ref('bus');
    ref.on('child_added',   function (s) { latest[s.key] = s.val(); emit(); });
    ref.on('child_changed', function (s) { latest[s.key] = s.val(); emit(); });
    ref.on('child_removed', function (s) { delete latest[s.key];   emit(); });
    setInterval(emit, 1000);
    firebase.database().ref('.info/connected').on('value', function (s) {
      if (window.console) console.log('실시간 위치 채널: ' + (s.val() ? '연결됨' : '끊김(재연결 시도)'));
    });
    started = true;
    return true;
  }

  try { start(); } catch (e) {
    if (window.console) console.warn('실시간 위치 채널 시작 실패:', e);
  }

  /* 지도가 부르는 함수. 이미 받아둔 값이 있으면 즉시 한 번 넘긴다. */
  window.__liveSubscribe = function (cb) {
    if (typeof cb !== 'function') return false;
    if (!started && !start()) return false;
    subs.push(cb);
    var list = snapshotList();
    if (list.length) { try { cb(list); } catch (e) {} }
    return true;
  };
})();
</script>

</body>
